appId: com.turingmachine.app
productName: Turing Machine
directories:
  buildResources: build
publish:
  provider: github
  owner: 619best-sudo
  repo: OpenWaggleMain
# ALLOWLIST, not a denylist.
#
# This was previously negation-only ('!src/*', '!**/.vscode/*', ...), which
# means electron-builder's default '**/*' applied and every path not explicitly
# excluded was packaged. That shipped .env.local (real credentials), the
# developer's .openwaggle-user-data-dev/ session database, .home/, and
# .pnpm-store/ into app.asar — 4.33 GB, with secrets in it.
#
# An allowlist fails closed: a new scratch directory in the repo root is simply
# not packaged, instead of silently becoming part of the release. Add entries
# here deliberately; never reintroduce a bare negation-only list.
files:
  # Only the three bundles the app actually runs. `out/**` would also ship
  # out/src/** (declaration output for the entire source tree — 527 files
  # describing every internal module), out/scripts/** (internal build tooling),
  # out/e2e/**, and .tsbuildinfo. None of that is loaded at runtime.
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  # node_modules is still resolved from the production dependency tree,
  # so these size trims remain meaningful.
  # Exclude non-runtime files from node_modules to reduce asar size
  - '!node_modules/**/@types'
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/*.d.mts'
  - '!node_modules/**/*.map'
  - '!node_modules/**/README*'
  - '!node_modules/**/CHANGELOG*'
  - '!node_modules/**/LICENSE*'
  - '!node_modules/**/.github'
  - '!node_modules/**/docs'
  - '!node_modules/**/test'
  - '!node_modules/**/tests'
  - '!node_modules/**/__tests__'
  - '!node_modules/**/examples'
  - '!node_modules/**/.eslintrc*'
  - '!node_modules/**/.prettierrc*'
  - '!node_modules/**/tsconfig.json'
  # Exclude unused ONNX training WASM files (only inference is needed)
  - '!node_modules/onnxruntime-web/dist/ort-training*'
extraResources:
  - from: build/icon.png
    to: icon.png
  # Runtime env for the packaged app. Sits beside app.asar at a real filesystem
  # path, which is the only place `getEnvFilePaths()` can actually read from in a
  # packaged build (cwd is never the repo, and never inside the asar).
  #
  # CURATED — put only keys the shipped app needs in build/app.env. Never point
  # this at .env.local: that file also holds keys that must not be distributed.
  # Anything here is recoverable by unzipping the app.
  - from: build/app.env
    to: app.env
asarUnpack:
  - node_modules/pi-mcp-adapter/**/*
mac:
  # Local builds: skip codesigning (no Apple Developer ID).
  # Distribution: remove this, configure CSC_LINK/CSC_KEY_PASSWORD.
  identity: null
  icon: build/icon.icns
  artifactName: ${name}-${version}-${arch}.${ext}
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: build/icon.png
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
